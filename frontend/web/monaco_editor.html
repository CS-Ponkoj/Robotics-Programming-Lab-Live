<!DOCTYPE html>
<html>

<head>

  <!-- Load the webassembly python interpreter -->

  <link rel="stylesheet" href="https://pyscript.net/releases/2024.7.1/core.css"> -->

  <!-- Load the Monaco Editor Loader Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.min.js"></script>
  <link rel="stylesheet" data-name="vs/editor/editor.main"
    href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/editor/editor.main.min.css">


  <script src="app.js"></script>
  <script>
    globalThis.getMonacoEditorValue = function ()
    {
      var val = monaco.editor.getModels()[0].getValue().toString();
      return val;
    }

  </script>

  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      /* Establishes a flex container */
      overflow: hidden;
      ;
      /* Prevents unwanted overflow */
    }

    #editorArea,
    #output {
      flex: 1;
      /* This ensures both the editor area and output take up equal space */
      min-width: 0;
      /* Prevents flex items from growing beyond their content size, allowing shrinking */
    }

    #editorArea {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* Ensures overflow content in the editor is scrollable */
    }

    #toolbar {
      padding: 10px;
      background-color: #f5f5f5;
      border-bottom: 1px solid #ccc;
    }

    #editorContainer {
      flex-grow: 1;
      overflow: auto;
      /* Allows scrolling within the editor if content overflows */
    }

    #container {
      width: 100%;
      height: 100%;
      /* Ensures the editor uses the full available area */
    }

    #outputArea {
      display: flex;
      flex-direction: column;
      flex: 1;
      /* Equal width with the editor area */
      overflow: hidden;
      /* Hide overflow */
    }

    #outputToolbar {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      background-color: #f5f5f5;
      border-bottom: 1px solid #ccc;
    }


    #output {
      flex-grow: 1;
      padding: 10px;
      overflow: auto;
      /* Make output scrollable */
      border-left: 1px solid #ddd;
      /* Visual separation */
    }
  </style>
</head>

<body>
  <div id="editorArea">
    <div id="toolbar">
      <!-- <select id="languageSelector">
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>

        <option value="css">CSS</option>
      </select> -->
      <div style="float: right;">
        <!-- <button id="exitEditorButton">Exit</button> -->
        <button id="runCodeButton">Run</button>
      </div>
    </div>
    <div id="editorContainer">
      <div id="container"></div>
    </div>
  </div>

      <button id="runCodeButton">Run</button>

  </div> -->
</body>

</html>
