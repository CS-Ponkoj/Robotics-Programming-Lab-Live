services:
  - type: web
    name: robotics-programming-lab-sandbox
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile.sandbox-service
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: SANDBOX_API_TOKEN
        generateValue: true
      - key: SANDBOX_MAX_CONCURRENT_EXECUTIONS
        value: "2"

  - type: web
    name: robotics-programming-lab-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic -c alembic.ini upgrade head && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: ENABLE_DEMO_ACCOUNTS
        value: "true"
      - key: DEMO_STUDENT_PASSWORD
        sync: false
      - key: DEMO_INSTRUCTOR_PASSWORD
        sync: false
      - key: ENABLE_PASSWORD_RESET
        value: "false"
      - key: ENABLE_EMAIL_FEATURES
        value: "false"
      - key: SANDBOX_BACKEND
        value: remote
      - key: SANDBOX_URL
        fromService:
          type: web
          name: robotics-programming-lab-sandbox
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: SANDBOX_API_TOKEN
        fromService:
          type: web
          name: robotics-programming-lab-sandbox
          envVarKey: SANDBOX_API_TOKEN
      - key: SANDBOX_HTTP_TIMEOUT_SECONDS
        value: "75"
      - key: EXECUTION_REQUESTS_PER_MINUTE
        value: "30"
      - key: TUTOR_REQUESTS_PER_MINUTE
        value: "10"
      - key: MAX_CONCURRENT_EXECUTIONS
        value: "2"
      - key: MAX_REQUEST_BYTES
        value: "100000"
      - key: OPENAI_API_KEY
        sync: false
