services:
  sandbox-image:
    image: robotics-lab-sandbox:latest
    build:
      context: backend
      dockerfile: Dockerfile.sandbox
    profiles: ["build"]

  ros2-grader-image:
    image: robotics-lab-ros2-grader:jazzy-v1
    build:
      context: backend
      dockerfile: Dockerfile.ros2
    profiles: ["build"]
