name: staging verification

on:
  push:
    branches: [main, v4-live]
  pull_request:

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject generated or secret-bearing tracked paths
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(\.env|env|venv|venvs|build|\.dart_tool|\.local-run)(/|$)|\.(db|sqlite|sqlite3)$' || true)"
          if [ -n "$forbidden" ]; then
            echo "$forbidden"
            exit 1
          fi

  ubuntu-local-setup:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true
      - name: Verify Bash scripts
        run: |
          find scripts -maxdepth 1 -name '*.sh' -exec bash -n {} +
          shellcheck -x scripts/*.sh
      - name: Prepare managed Python 3.14 environment
        run: ./scripts/setup-local.sh

  backend:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      DATABASE_URL: sqlite://
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: robotics
          POSTGRES_PASSWORD: robotics
          POSTGRES_DB: robotics_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U robotics -d robotics_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: python -m pip check
      - name: Verify PostgreSQL migration
        env:
          DATABASE_URL: postgresql+psycopg://robotics:robotics@127.0.0.1:5432/robotics_lab
        run: alembic -c alembic.ini upgrade head

  sandbox-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build dedicated sandbox image
        run: docker build -f backend/Dockerfile.sandbox-service -t robotics-lab-sandbox-service .
      - name: Smoke test sandbox image
        shell: bash
        run: |
          docker run -d --name robotics-lab-sandbox -p 18081:10000 \
            -e SANDBOX_API_TOKEN=ci-sandbox-token-at-least-24-characters \
            robotics-lab-sandbox-service
          trap 'docker logs robotics-lab-sandbox; docker rm -f robotics-lab-sandbox' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18081/health | grep 'dedicated-service'
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"code":"answer = 2 + 2","result_names":["answer"]}' \
            http://127.0.0.1:18081/execute)"
          test "$status" = "401"

  ros2-grader-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned ROS 2 grader image
        run: docker build -f backend/Dockerfile.ros2 -t robotics-lab-ros2-grader:jazzy-v1 backend
      - name: Verify maintained ROS 2 assignment answers
        run: python backend/verify_ros2_assignments.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=API_BASE_URL=https://api.example.test
