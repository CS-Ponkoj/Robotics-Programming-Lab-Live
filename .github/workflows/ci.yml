name: v4 verification

on:
  push:
    branches: [main, v4-live]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: robotics
          POSTGRES_PASSWORD: robotics
          POSTGRES_DB: robotics_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U robotics -d robotics_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: python -m pip check
      - name: Verify PostgreSQL migration
        env:
          DATABASE_URL: postgresql+psycopg://robotics:robotics@127.0.0.1:5432/robotics_lab
        run: alembic -c alembic.ini upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=API_BASE_URL=https://api.example.test
